<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10201d" />
    <title>Skroutz Picklist - Εκτός σύνδεσης</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f5ef; color: #10201d; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; text-align: center; }
      main { max-width: 420px; }
      .mark { display: grid; width: 72px; height: 72px; margin: 0 auto 24px; place-items: center; border-radius: 22px; background: #c7f36b; font-size: 32px; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -0.05em; }
      p { margin: 12px 0 0; color: #75827d; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main><div class="mark">✓</div><h1>Είσαι εκτός σύνδεσης</h1><p>Η αποθηκευμένη checklist παραμένει διαθέσιμη όταν ανοίξει ξανά η εφαρμογή.</p></main>
  </body>
</html>
